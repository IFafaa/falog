[package]
name = "falog-desktop"
description = "Falog desktop app: board, list, focus and calendar views for your tasks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "falog"
path = "src/main.rs"

[dependencies]
falog-calendar.workspace = true
falog-core.workspace = true

anyhow.workspace = true
chrono.workspace = true
cpal.workspace = true
dirs.workspace = true
eframe.workspace = true
egui_extras.workspace = true
raw-window-handle.workspace = true
serde.workspace = true
serde_json.workspace = true
ureq.workspace = true
whisper-rs = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
winreg.workspace = true

# The `gpu` feature turns on the GPU backend that fits the platform. Cargo features cannot depend on the
# target, so it enables whisper-rs's own whisper-rs-sys, declared per target with the backend feature.
# (whisper-rs's `metal`/`vulkan` features only forward to these; it rejects a second, renamed copy.)
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs-sys = { workspace = true, optional = true, features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs-sys = { workspace = true, optional = true, features = ["vulkan"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
default = ["whisper"]
# Local speech recognition. Needs CMake and LLVM (libclang) at build time.
whisper = ["dep:whisper-rs"]
# Runs Whisper on the GPU: Metal on macOS; Vulkan on Windows and Linux, which needs the Vulkan SDK at
# build time and a Vulkan driver at run time.
gpu = ["whisper", "dep:whisper-rs-sys"]

[lints]
workspace = true
