[package]
name = "falog-desktop"
description = "Falog desktop app: a Zed-inspired board, list and agenda for your tasks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "falog"
path = "src/main.rs"

[dependencies]
falog-core.workspace = true

anyhow.workspace = true
chrono.workspace = true
cpal.workspace = true
dirs.workspace = true
eframe.workspace = true
egui_extras.workspace = true
raw-window-handle.workspace = true
serde.workspace = true
serde_json.workspace = true
ureq.workspace = true
whisper-rs = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
winreg.workspace = true

[features]
default = ["whisper"]
# Local speech recognition. Needs CMake and LLVM (libclang) at build time.
whisper = ["dep:whisper-rs"]

[lints]
workspace = true
