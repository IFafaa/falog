<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- falog.svg redrawn on the 16 px grid (title bars, tabs, small icons): 2 px strokes, 1 px gaps. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#31363f"/>
      <stop offset="1" stop-color="#22262c"/>
    </linearGradient>
  </defs>
  <rect width="16" height="16" rx="3.5" fill="url(#tile)"/>
  <g fill="#74ade8">
    <rect x="3" y="3" width="10" height="2" rx="0.5"/>
    <rect x="3" y="3" width="2" height="10" rx="0.5"/>
    <rect x="6" y="6" width="2" height="6" rx="0.5"/>
    <rect x="9" y="7" width="2" height="4" rx="0.5"/>
    <rect x="12" y="8" width="2" height="2" rx="0.5"/>
  </g>
</svg>
