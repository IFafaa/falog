# SonarQube Cloud (https://sonarcloud.io): the `sonar` job of .github/workflows/ci.yml scans with these
# settings once the SONAR_TOKEN secret exists. The organization and project key are the ones
# SonarQube Cloud shows when the repository is imported.
sonar.organization=ifafaa
sonar.projectKey=IFafaa_falog
sonar.projectName=Falog
sonar.sources=crates,tools
sonar.exclusions=**/target/**,**/assets/**
sonar.tests=crates
sonar.test.inclusions=**/tests.rs,**/*_tests.rs
