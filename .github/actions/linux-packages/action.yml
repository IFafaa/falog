name: Linux build packages
description: Installs the Ubuntu packages Falog needs to build.

inputs:
  gpu:
    description: Also install the Vulkan headers and glslc, for the gpu feature.
    default: "false"

runs:
  using: composite
  steps:
    - name: Install Linux packages
      shell: bash
      env:
        GPU: ${{ inputs.gpu }}
      run: |
        # ALSA for the microphone (cpal); X11, Wayland and xkbcommon for the window (eframe);
        # CMake and libclang for whisper.cpp (voice input).
        packages="pkg-config libasound2-dev
          libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev
          cmake clang libclang-dev"
        if [ "$GPU" = true ]; then
          packages="$packages libvulkan-dev glslc"
        fi
        sudo apt-get update
        # shellcheck disable=SC2086 # one word per package
        sudo apt-get install -y --no-install-recommends $packages
