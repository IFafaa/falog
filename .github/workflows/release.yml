# Publishes a GitHub Release when a version tag is pushed (git tag v0.2.0 && git push origin v0.2.0).
# How to cut a release: .spec/releases.md. Normal pushes only run CI (ci.yml).
#
# Two channels, chosen by the tag: vX.Y.Z publishes a Stable release, the one releases/latest serves;
# vX.Y.Z-beta.N or -rc.N publishes the same assets as a Preview, a GitHub pre-release. The release body
# is scripts/release-notes.sh: the Conventional Commits since the previous release.
#
# The assets keep the same names in every release, so
# https://github.com/IFafaa/falog/releases/latest/download/<name> always points at the newest one:
#   Falog-Setup-x64.exe                                Windows installer (CPU voice)
#   Falog-macOS-arm64.dmg, Falog-macOS-x64.dmg         macOS app (Metal voice), signed ad hoc only
#   falog-linux-x86_64.tar.gz, install.sh              Linux archive and its curl | sh installer
#   SHA256SUMS                                         checksums of all of the above
#
# Actions are pinned to commit SHAs (the comment says which release), as in ci.yml. Builds use no
# cache, so a release is built only from the tagged sources.
name: Release

on:
  push:
    tags: ["v*"]
  # A dry run from the Actions tab: builds every download from the chosen branch and publishes nothing.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # whisper.cpp otherwise tunes itself for the build machine's CPU (AVX-512 on the runners) and the
  # download would crash on older processors. Off, it targets AVX2/FMA/F16C on x86-64 (2013 on) and
  # the baseline of Apple silicon. Windows sets the same in cmake/whisper.cmake.
  GGML_NATIVE: "OFF"

jobs:
  # The tag must name the version being built, or the app would show another number than the release.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches Cargo.toml
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # The first version line is [workspace.package]'s.
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          # Dry runs (workflow_dispatch) build whatever version the branch has.
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match version = \"$version\" in Cargo.toml; bump it in a 'chore: release v<version>' commit and tag that commit."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - name: Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build the installer
        run: ./scripts/build-installer.ps1 -OutputName Falog-Setup-x64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: target/installer/Falog-Setup-x64.exe
          if-no-files-found: error

  macos:
    name: macos (${{ matrix.arch }})
    needs: version
    strategy:
      matrix:
        include:
          - { arch: arm64, runner: macos-latest }
          - { arch: x64, runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      # The oldest macOS Falog.app declares (LSMinimumSystemVersion in scripts/macos-app.sh).
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - name: Link clang's runtime
        run: |
          # whisper.cpp's Metal code checks the macOS version at run time (@available), which needs
          # __isPlatformVersionAtLeast from clang's runtime once the deployment target is older than
          # the APIs it guards. rustc links with -nodefaultlibs, so add the runtime explicitly.
          runtime="$(xcrun clang --print-resource-dir)/lib/darwin/libclang_rt.osx.a"
          test -f "$runtime"
          echo "RUSTFLAGS=-C link-arg=$runtime" >> "$GITHUB_ENV"
      - name: Build
        run: sh scripts/ci-build.sh --release --workspace --locked --features falog-desktop/gpu
      - name: Check the architecture
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          expected=$([ "$ARCH" = x64 ] && echo x86_64 || echo arm64)
          for bin in target/release/falog target/release/falog-mcp; do
            archs=$(lipo -archs "$bin")
            echo "$bin: $archs"
            test "$archs" = "$expected"
          done
      - name: Package
        run: sh scripts/package-macos.sh target/release "Falog-macOS-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-${{ matrix.arch }}
          path: Falog-macOS-${{ matrix.arch }}.dmg
          if-no-files-found: error

  # Built on the oldest supported Ubuntu: the binaries need the glibc they were linked against or newer,
  # so 22.04 (glibc 2.35) runs on most current distributions.
  linux:
    needs: version
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/linux-packages
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - name: Build
        run: sh scripts/ci-build.sh --release --workspace --locked
      - name: Package
        run: sh scripts/package-linux.sh target/release falog-linux-x86_64.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: falog-linux-x86_64.tar.gz
          if-no-files-found: error

  publish:
    needs: [version, windows, macos, linux]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The release notes need the previous tags and the commits since.
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Linux installer
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Pin the installer to this release, so install.sh from release N installs release N.
          sed "s/^release_tag=\"\"\$/release_tag=\"$TAG\"/" scripts/install-release.sh > dist/install.sh
          grep -qx "release_tag=\"$TAG\"" dist/install.sh
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum Falog-Setup-x64.exe Falog-macOS-arm64.dmg Falog-macOS-x64.dmg \
            falog-linux-x86_64.tar.gz install.sh > SHA256SUMS
          cat SHA256SUMS
      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          sh scripts/release-notes.sh "$TAG" > notes.md
          cat notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # Channels: vX.Y.Z is Stable (releases/latest); a suffix (v0.3.0-beta.1, -rc.1) is Preview,
          # a GitHub pre-release that never becomes latest.
          case "$VERSION" in
            *-*) kind=--prerelease ;;
            *) kind=--latest ;;
          esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag "$kind" \
            --title "Falog $VERSION" --notes-file notes.md \
            dist/Falog-Setup-x64.exe dist/Falog-macOS-arm64.dmg dist/Falog-macOS-x64.dmg \
            dist/falog-linux-x86_64.tar.gz dist/install.sh dist/SHA256SUMS
