# The quality gate: every push and pull request to main must pass all of it. Branch protection
# requires only the `quality-gate` job, which fails when any other job did. What each job checks and
# how to fix a failure: the CI section of .spec/conventions.md. scripts/check.ps1 and
# scripts/check.sh run the same checks locally.
#
# Actions are pinned to commit SHAs (the comment says which release); update them together.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Warnings fail every build, not only clippy's.
  RUSTFLAGS: -D warnings

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Clippy on every OS and feature set: code behind cfg(windows) / cfg(target_os) must be clean on
  # all three. The gpu feature is Metal on macOS and Vulkan on Linux; the Windows runner has no
  # Vulkan SDK, so Windows builds it only on developer machines.
  lint:
    name: lint (${{ matrix.os }}, ${{ matrix.features }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, features: no-default, flags: --no-default-features }
          - { os: ubuntu-latest, features: default, flags: "" }
          - { os: ubuntu-latest, features: gpu, flags: --features falog-desktop/gpu }
          - { os: macos-latest, features: no-default, flags: --no-default-features }
          - { os: macos-latest, features: default, flags: "" }
          - { os: macos-latest, features: gpu, flags: --features falog-desktop/gpu }
          - { os: windows-latest, features: no-default, flags: --no-default-features }
          - { os: windows-latest, features: default, flags: "" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-packages
        with:
          gpu: ${{ matrix.features == 'gpu' }}
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.features }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked ${{ matrix.flags }} -- -D warnings

  # Doc comments: broken intra-doc links, invalid code blocks and bad HTML fail.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/linux-packages
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --workspace --no-deps --document-private-items --locked

  test:
    name: test (${{ matrix.os }}, ${{ matrix.features }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        features: [no-default, default]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-packages
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.features }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: test
        shell: bash
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          if [ "$FEATURES" = no-default ]; then
            cargo test --workspace --locked --no-fail-fast --no-default-features
          else
            cargo test --workspace --locked --no-fail-fast
          fi

  # Line coverage of the tests, without voice input (whisper adds build time, not tested code).
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # 44.86% of lines on 2026-10-07 (measured on Windows, same flags), minus a margin for the
      # code that differs per OS. A ratchet: raise it as tests are added, never lower it to let a
      # change pass.
      MIN_LINE_COVERAGE: 42
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/linux-packages
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run the tests with coverage
        run: cargo llvm-cov --workspace --locked --no-default-features --no-report
      - name: Write lcov.info
        run: cargo llvm-cov report --lcov --output-path lcov.info
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov
          path: lcov.info
          if-no-files-found: error
      - name: Check the minimum line coverage
        run: cargo llvm-cov report --fail-under-lines "$MIN_LINE_COVERAGE"

  # The rust-version declared in Cargo.toml must really build Falog.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/linux-packages
      - name: Read rust-version
        id: msrv
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --all-targets --locked

  # Advisories, licenses, banned and duplicate crates, sources: deny.toml.
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-deny
      - run: cargo deny --locked check

  # Secrets, design-model app names and conflict markers; spelling; shell scripts; workflows.
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Repository policy
        run: sh scripts/check-policy.sh
      - name: Spelling
        uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1
      - name: shellcheck
        run: shellcheck --severity=warning scripts/*.sh
      - name: actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v$VERSION/$archive"
          echo "$SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"

  # Conventional Commits for the commits a pull request adds.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: sh scripts/check-commits.sh "$BASE..$HEAD"

  # The one check branch protection requires.
  quality-gate:
    if: always()
    needs: [format, lint, docs, test, coverage, msrv, dependencies, policy, commits]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # Only `commits` may be skipped (it runs on pull requests only).
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key) \(.value.result)"' | {
            failed=0
            while read -r job result; do
              echo "$job: $result"
              case "$job:$result" in
                *:success | commits:skipped) ;;
                *) failed=1 ;;
              esac
            done
            exit "$failed"
          }
