# Publishes the public site (https://ifafaa.github.io/falog/) to GitHub Pages: the Astro project in
# site/, which also reads the fonts and icon from crates/falog-desktop/assets and the roadmap from
# .spec/roadmap.md. The pages read releases from the GitHub API in the browser, so a new release needs
# no redeploy.
#
# One-time setup: repository Settings › Pages › Source: GitHub Actions.
# Actions are pinned to commit SHAs (the comment says which release); update them together.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - .spec/roadmap.md
      - crates/falog-desktop/assets/fonts/**
      - crates/falog-desktop/assets/icon/**
      - .github/workflows/pages.yml
  pull_request:
    branches: [main]
    paths:
      - site/**
      - .spec/roadmap.md
      - .github/workflows/pages.yml
  workflow_dispatch:

# One deployment at a time; a newer push replaces a queued one but never cancels a running deploy.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  # Pull requests only build, so a broken site fails before it reaches main.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
