# whisper-rs-sys forwards CMAKE_* and GGML_* environment variables to CMake when it builds whisper.cpp
# (voice input). Cargo's [env] cannot vary per target, so this only points CMake at a file that applies
# compiler-specific settings itself; see cmake/whisper.cmake.
[env]
CMAKE_PROJECT_INCLUDE = { value = "cmake/whisper.cmake", relative = true }
