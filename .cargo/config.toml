# whisper.cpp (voice input) is built with CMake by whisper-rs-sys, which forwards GGML_* and CMAKE_*
# environment variables to CMake. Two MSVC pitfalls make transcription 30-100x slower if left alone:
#
# - the `cmake` crate replaces CMAKE_<LANG>_FLAGS_RELEASE with flags that have no /O2, so the C++ code
#   is built unoptimized;
# - ggml's GGML_NATIVE cannot detect CPU features under MSVC and leaves SIMD off. Target AVX2
#   explicitly: any x86-64 CPU from 2013 on.
[env]
CMAKE_C_FLAGS_RELEASE = "/O2 /Ob2 /DNDEBUG -nologo -MD -Brepro -W0"
CMAKE_CXX_FLAGS_RELEASE = "/O2 /Ob2 /DNDEBUG /utf-8 -nologo -MD -Brepro -W0"
GGML_NATIVE = "OFF"
GGML_AVX = "ON"
GGML_AVX2 = "ON"
GGML_FMA = "ON"
GGML_F16C = "ON"
