[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Fabricio Lima"]

[workspace.dependencies]
falog-calendar = { path = "crates/falog-calendar" }
falog-core = { path = "crates/falog-core" }

anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
cpal = "0.18"
dirs = "6"
eframe = { version = "0.29", features = ["persistence"] }
egui_extras = { version = "0.29", features = ["svg"] }
getrandom = "0.3"
raw-window-handle = "0.6"
rrule = "0.14"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
ureq = "2"
whisper-rs = "0.16"
# Only to pick the GPU backend of the `gpu` feature (see crates/falog-desktop); whisper-rs depends on it.
whisper-rs-sys = "0.15"
winreg = "0.55"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
